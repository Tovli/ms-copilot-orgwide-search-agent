# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.12/yaml.schema.json
version: v1.12
environmentFolderPath: ./env

# Explicit authenticated development action. Use a configured persistent app ID.
# Personal publishing accepts the ZIP directly; no Developer Portal update is needed.
# No admin-consent, Azure, or tenant-wide publishing action is configured.
provision:
  - uses: cli/runNpmCommand
    with:
      args: run compile
  - uses: cli/runNpmCommand
    with:
      args: run stage -- --config local/deployment.json
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./dist/tenant/appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: copilotAgent/publish
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      scope: personal
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID
      shareLink: SHARE_LINK
