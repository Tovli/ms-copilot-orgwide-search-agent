name: Validate reusable agent
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-validation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Microsoft Toolkit manifest validation
        run: npm exec -- atk validate --manifest-file dist/validation/appPackage/manifest.json --telemetry false --interactive false
      - name: Publish synthetic validation artifact only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-only-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            dist/validation/*.zip
            dist/validation/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
